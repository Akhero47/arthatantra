services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arthatantra
      POSTGRES_USER: arthatantra
      POSTGRES_PASSWORD: arthatantra
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthatantra -d arthatantra"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: