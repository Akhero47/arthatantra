services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: arthatantra
      POSTGRES_USER: arthatantra
      POSTGRES_PASSWORD: arthatantra

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthatantra -d arthatantra"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-db:
    image: postgres:16

    environment:
      POSTGRES_DB: arthatantra_test
      POSTGRES_USER: arthatantra
      POSTGRES_PASSWORD: arthatantra

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthatantra -d arthatantra_test"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+psycopg://arthatantra:arthatantra@db:5432/arthatantra
      TEST_DATABASE_URL: postgresql+psycopg://arthatantra:arthatantra@test-db:5432/arthatantra_test

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
  
  app-test:
    profiles:
      - test

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+psycopg://arthatantra:arthatantra@test-db:5432/arthatantra_test
      TEST_DATABASE_URL: postgresql+psycopg://arthatantra:arthatantra@test-db:5432/arthatantra_test

    ports:
      - "8001:8000"

    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_test_data: